# ============================================================
# Bali Best Holiday — Nginx HTTP config (Stage 1: pre-HTTPS)
#
# This config is HTTP-only. It serves the app on port 80 AND handles
# Let's Encrypt ACME challenges so Certbot can issue a cert.
#
# After cert is issued, run:
#   bash deploy/nginx/scripts/enable-https.sh
# That script swaps in balibestholiday-https.conf and reloads Nginx.
#
# NOTE: Global HTTP-context directives (limit_req_zone, set_real_ip_from,
# upstream) live in 00-shared.conf so they're declared exactly once,
# regardless of which server config is active. They were duplicated here
# previously, which caused Nginx to fail to start with:
#   "limit_req_zone is already bound to key" → all traffic 502.
# ============================================================

# DNS resolver for re-resolving service names (Docker's embedded DNS).
# Without this, nginx caches the upstream IP at startup; when the app
# container restarts and gets a new IP, nginx keeps connecting to the
# old (now-dead) IP and every request returns 502 until nginx is
# manually restarted. The `valid=10s` re-resolves every 10 seconds.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name balibestholiday.com www.balibestholiday.com _;

  # ACME challenge — required for Let's Encrypt cert issuance
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
  }

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;
  gzip_proxied any;

  client_max_body_size 5M;
  client_body_timeout 60s;

  # Use a variable for proxy_pass so nginx re-resolves DNS at request time
  # (the resolver directive above provides the cache TTL). Without the
  # variable, nginx only resolves "app" once at config load and caches
  # forever — exactly the bug that took the site down 5/24.
  set $next_upstream http://app:3000;

  location /_next/static/ {
    proxy_pass $next_upstream;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /_next/image {
    proxy_pass $next_upstream;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location /api/duffel/ {
    limit_req zone=duffel burst=20 nodelay;
    limit_req_status 429;
    proxy_pass $next_upstream;
    include /etc/nginx/conf.d/proxy-common.inc;
  }

  location /api/ {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass $next_upstream;
    include /etc/nginx/conf.d/proxy-common.inc;
  }

  location / {
    proxy_pass $next_upstream;
    include /etc/nginx/conf.d/proxy-common.inc;
  }

  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
