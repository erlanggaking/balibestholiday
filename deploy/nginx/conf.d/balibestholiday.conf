# ============================================================
# Bali Best Holiday — Nginx reverse proxy config
# - Terminates HTTPS (cert managed by Certbot)
# - Forwards to Next.js container on app:3000
# - Rate limit on /api/duffel/* to protect upstream API quota
# ============================================================

# Rate limit zones (10 MB = ~160k IPs tracked)
limit_req_zone $binary_remote_addr zone=duffel:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Trust the Docker network as proxy source
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

upstream nextjs_upstream {
  server app:3000;
  keepalive 32;
}

# ---- HTTP: redirect everything to HTTPS, except ACME challenge ----
server {
  listen 80;
  listen [::]:80;
  server_name balibestholiday.com www.balibestholiday.com;

  # Let's Encrypt ACME challenge
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- HTTPS ----
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name balibestholiday.com www.balibestholiday.com;

  # SSL — Let's Encrypt cert (mounted from certbot volume)
  ssl_certificate     /etc/letsencrypt/live/balibestholiday.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/balibestholiday.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;
  gzip_proxied any;

  # Body size (image uploads)
  client_max_body_size 5M;
  client_body_timeout 60s;

  # Static assets — long cache
  location /_next/static/ {
    proxy_pass http://nextjs_upstream;
    proxy_cache_valid 200 365d;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /_next/image {
    proxy_pass http://nextjs_upstream;
    proxy_cache_valid 200 30d;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # Rate-limit Duffel proxy endpoints (protect upstream quota)
  location /api/duffel/ {
    limit_req zone=duffel burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://nextjs_upstream;
    include /etc/nginx/conf.d/proxy-common.inc;
  }

  # Other API endpoints — gentler rate limit
  location /api/ {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://nextjs_upstream;
    include /etc/nginx/conf.d/proxy-common.inc;
  }

  # Everything else → Next.js
  location / {
    proxy_pass http://nextjs_upstream;
    include /etc/nginx/conf.d/proxy-common.inc;
  }

  # Health check (internal only)
  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
